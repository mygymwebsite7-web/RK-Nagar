    <rect x="42" y="72" width="18" height="30" rx="8" fill="#909090"/>
    <!-- Tail -->
    <path d="M46,42 Q60,50 58,65" stroke="#888" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Raised front leg -->
    <rect x="-22" y="55" width="18" height="28" rx="8" fill="#989898" transform="rotate(-25,-13,60)"/>
  </g>

  <!-- ═══ RIGHT ELEPHANT (mirrored) ═══ -->
  <g transform="translate(415,100) scale(-1,1)">
    <!-- Body -->
    <ellipse cx="0" cy="45" rx="48" ry="38" fill="#A0A0A0"/>
    <!-- Head -->
    <ellipse cx="-28" cy="20" rx="30" ry="26" fill="#A8A8A8"/>
    <!-- Ear -->
