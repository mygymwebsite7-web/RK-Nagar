  <!-- Lotus flower -->
  <!-- Green base leaves -->
  <ellipse cx="250" cy="168" rx="18" ry="7" fill="#228B22"/>
  <ellipse cx="238" cy="165" rx="12" ry="5" fill="#228B22" transform="rotate(-20,238,165)"/>
