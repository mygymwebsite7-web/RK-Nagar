    <path d="M-52,32 Q-70,50 -65,72 Q-60,88 -50,90" stroke="#909090" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Tusk -->
    <path d="M-52,38 Q-72,44 -75,55" stroke="#F5F5DC" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="-36" cy="16" r="5" fill="#1a1a1a"/>
    <circle cx="-35" cy="15" r="2" fill="white"/>
    <!-- Front legs -->
