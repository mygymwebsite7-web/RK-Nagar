<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – TVK Complaint Box</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-placeholder"></div>

<div style="background:linear-gradient(135deg,#6B0000,#B80000,#B84000,#C8A000);padding:40px 20px;text-align:center;border-bottom:3px solid #FFD700;">
  <h1 style="color:#FFD700;font-size:clamp(22px,5vw,34px);font-weight:800" data-i18n="contact_title">Contact Us</h1>
  <p style="color:rgba(255,230,150,0.85);margin-top:8px;font-size:14px" class="tamil">தொடர்பு கொள்ளுங்கள்</p>
</div>

<div class="container" style="padding:50px 20px;max-width:700px;">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:40px;">
    <div class="card" style="text-align:center;padding:28px;">
      <div style="font-size:36px;margin-bottom:12px">📱</div>
      <h3 style="color:var(--yellow);margin-bottom:6px">WhatsApp</h3>
      <p style="font-size:13px;color:var(--muted)" class="tamil">புகார் பதிவு & தகவல்</p>
      <a href="https://wa.me/919876543210" target="_blank"
         style="display:inline-block;margin-top:12px;background:#25d366;color:white;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;">
        WhatsApp Us
      </a>
    </div>

    <div class="card" style="text-align:center;padding:28px;">
      <div style="font-size:36px;margin-bottom:12px">📧</div>
      <h3 style="color:var(--yellow);margin-bottom:6px">Email</h3>
      <p style="font-size:13px;color:var(--muted)">rknagar.complaintbox@gmail.com</p>
      <a href="mailto:rknagar.complaintbox@gmail.com"
         style="display:inline-block;margin-top:12px;background:linear-gradient(135deg,#7A0010,#C25000);color:#F5C518;border:1.5px solid #F5C518;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;">
        Send Email
      </a>
    </div>

    <div class="card" style="text-align:center;padding:28px;">
      <div style="font-size:36px;margin-bottom:12px">📍</div>
      <h3 style="color:var(--yellow);margin-bottom:6px">Office</h3>
      <p style="font-size:13px;color:var(--muted)" class="tamil">ஆர்.கே. நகர் தொகுதி அலுவலகம்<br>R.K. Nagar, Chennai</p>
    </div>
  </div>

  <div style="background:linear-gradient(135deg,#2A0D00,#6B0000,#B84000);border-radius:var(--radius-lg);padding:32px;text-align:center;border:2px solid rgba(255,215,0,0.3);">
    <h2 style="color:var(--yellow);margin-bottom:12px" class="tamil">நேரடி புகார் பதிவு</h2>
    <p style="font-size:14px;color:rgba(255,230,150,0.8);margin-bottom:20px" class="tamil">
      ஆன்லைனில் புகார் பதிவு செய்து, உடனடி ஐடி பெறுங்கள்
    </p>
    <a href="report.html" class="btn-primary">📢 Report a Complaint Now</a>
  </div>
</div>

<a href="report.html" class="fab" data-i18n="fab_label">📢 Report</a>
<div id="footer-placeholder"></div>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
</body>
</html>
